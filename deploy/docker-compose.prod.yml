services:
  backend:
    image: ghcr.io/leonardosilvacosta/regula-backend:latest
    container_name: regula_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8150:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=https://regula.leadcode.com.br,http://localhost:3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - regula_net

  frontend:
    image: ghcr.io/leonardosilvacosta/regula-frontend:latest
    container_name: regula_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://regula.leadcode.com.br
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    networks:
      - regula_net

networks:
  regula_net:
    driver: bridge
